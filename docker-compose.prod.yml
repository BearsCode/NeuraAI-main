x-backend-env-file: &backend-env-file
  - .env

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: neura-backend:prod
    env_file: *backend-env-file
    environment:
      APP__ENV: production
      APP__HOST: 0.0.0.0
      APP__PORT: 8000
      DB__DSN: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neuaraai}
      REDIS__DSN: redis://redis:6379/0
      S3__ENDPOINT_URL: http://minio:9000
      S3__PUBLIC_BASE_URL: ${S3__PUBLIC_BASE_URL:-http://localhost:9000/neuaraai-media}
      S3__USE_PATH_STYLE: "true"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    env_file: *backend-env-file
    command: ["/bin/sh", "/opt/neura/nginx/start.sh"]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/start.sh:/opt/neura/nginx/start.sh:ro
      - ./deploy/nginx/templates/http.conf.template:/opt/neura/nginx/templates/http.conf.template:ro
      - ./deploy/nginx/templates/tls.conf.template:/opt/neura/nginx/templates/tls.conf.template:ro
      - certbot_www:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  certbot-init:
    image: certbot/certbot:v3.0.1
    container_name: neura-certbot-init
    env_file: *backend-env-file
    command: ["/bin/sh", "/opt/neura/certbot/init-letsencrypt.sh"]
    volumes:
      - ./deploy/certbot/init-letsencrypt.sh:/opt/neura/certbot/init-letsencrypt.sh:ro
      - certbot_www:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      nginx:
        condition: service_started

  certbot-renew:
    image: certbot/certbot:v3.0.1
    container_name: neura-certbot-renew
    env_file: *backend-env-file
    command: ["/bin/sh", "/opt/neura/certbot/renew-letsencrypt.sh"]
    volumes:
      - ./deploy/certbot/renew-letsencrypt.sh:/opt/neura/certbot/renew-letsencrypt.sh:ro
      - certbot_www:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    env_file: *backend-env-file
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuaraai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neuaraai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  letsencrypt_data:
