x-backend-env-files: &backend-env-files
  - .env

x-infra-env-files: &infra-env-files
  - .env

x-backend-image: &backend-image neura-backend:local
x-frontend-image: &frontend-image neura-frontend:local

x-backend-service: &backend-service
  image: *backend-image
  pull_policy: never
  env_file: *backend-env-files
  environment: &app-environment
    APP__HOST: 0.0.0.0
    APP__PORT: 8000
    DB__DSN: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-neuaraai}
    REDIS__DSN: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
    S3__ENDPOINT_URL: http://minio:9000
    S3__PUBLIC_BASE_URL: http://localhost:${MINIO_API_PORT:-9000}/${S3_BUCKET:-neuaraai-media}
    S3__USE_PATH_STYLE: "true"
    OBSERVABILITY__METRICS_ENABLED: "true"
    OBSERVABILITY__TRACES_ENABLED: "false"

x-frontend-env: &frontend-environment
  NODE_ENV: production
  PORT: 3000
  HOSTNAME: 0.0.0.0
  NEXT_TELEMETRY_DISABLED: "1"
  NEURAAI_API_PREFIX: /api/v1
  SECURE_COOKIES: "true"
  NEXT_PUBLIC_VK_CLIENT_ID: ${OAUTH__VK__CLIENT_ID:-}
  NEXT_PUBLIC_YANDEX_CLIENT_ID: ${OAUTH__YANDEX__CLIENT_ID:-}
  NEXT_PUBLIC_MAILRU_CLIENT_ID: ${OAUTH__MAILRU__CLIENT_ID:-}
  NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${NEXT_PUBLIC_TELEGRAM_BOT_NAME:-}

x-frontend-service: &frontend-service
  image: *frontend-image
  pull_policy: never
  build:
    context: ./frontend
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_VK_CLIENT_ID: ${OAUTH__VK__CLIENT_ID:-}
      NEXT_PUBLIC_YANDEX_CLIENT_ID: ${OAUTH__YANDEX__CLIENT_ID:-}
      NEXT_PUBLIC_MAILRU_CLIENT_ID: ${OAUTH__MAILRU__CLIENT_ID:-}
      NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${NEXT_PUBLIC_TELEGRAM_BOT_NAME:-}

services:
  api:
    <<: *backend-service
    build:
      context: .
      dockerfile: Dockerfile
    image: *backend-image
    container_name: neura-api
    command: >
      sh -c "python -m alembic upgrade head &&
      python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    volumes:
      - ./backend/app/static:/opt/venv/lib/python3.12/site-packages/backend/app/static:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    <<: *frontend-service
    container_name: neura-frontend
    environment:
      <<: *frontend-environment
      NEURAAI_BACKEND_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: neura-nginx
    profiles: ["production"]
    environment:
      WEB__DOMAIN: ${WEB__DOMAIN:-}
      APP_UPSTREAM: api:8000
      FRONTEND_UPSTREAM: frontend:3000
    command: ["/bin/sh", "/opt/neura/nginx/start.sh"]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/start.sh:/opt/neura/nginx/start.sh:ro
      - ./deploy/nginx/templates/http.conf.template:/opt/neura/nginx/templates/http.conf.template:ro
      - ./deploy/nginx/templates/tls.conf.template:/opt/neura/nginx/templates/tls.conf.template:ro
      - certbot_www:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  certbot-init:
    image: certbot/certbot:v3.0.1
    container_name: neura-certbot-init
    profiles: ["production"]
    environment:
      WEB__DOMAIN: ${WEB__DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      NGINX_HOST: nginx
      NGINX_PORT: 80
    command: ["/bin/sh", "/opt/neura/certbot/init-letsencrypt.sh"]
    volumes:
      - ./deploy/certbot/init-letsencrypt.sh:/opt/neura/certbot/init-letsencrypt.sh:ro
      - certbot_www:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      nginx:
        condition: service_started

  certbot-renew:
    image: certbot/certbot:v3.0.1
    container_name: neura-certbot-renew
    profiles: ["production"]
    environment:
      CERTBOT_RENEW_INTERVAL_SECONDS: ${CERTBOT_RENEW_INTERVAL_SECONDS:-43200}
    command: ["/bin/sh", "/opt/neura/certbot/renew-letsencrypt.sh"]
    volumes:
      - ./deploy/certbot/renew-letsencrypt.sh:/opt/neura/certbot/renew-letsencrypt.sh:ro
      - certbot_www:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  frontend-sqlite:
    <<: *frontend-service
    container_name: neura-frontend-sqlite
    profiles: ["sqlite"]
    environment:
      <<: *frontend-environment
      NEURAAI_BACKEND_URL: http://api-sqlite:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api-sqlite:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-sqlite:
    <<: *backend-service
    build:
      context: .
      dockerfile: Dockerfile
    image: *backend-image
    container_name: neura-api-sqlite
    profiles: ["sqlite"]
    command: >
      sh -c "python -m alembic upgrade head &&
      python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    environment:
      <<: *app-environment
      DB__DSN: sqlite+aiosqlite:////app/data/neuaraai.db
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker-llm:
    <<: *backend-service
    container_name: neura-worker-llm
    command: ["python", "-m", "arq", "backend.app.workers.llm_worker.WorkerSettings"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "backend.app.workers.llm_worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker-publisher:
    <<: *backend-service
    container_name: neura-worker-publisher
    command: ["python", "-m", "arq", "backend.app.workers.publisher_worker.WorkerSettings"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "backend.app.workers.publisher_worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker-analytics:
    <<: *backend-service
    container_name: neura-worker-analytics
    command: ["python", "-m", "arq", "backend.app.workers.analytics_worker.WorkerSettings"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "backend.app.workers.analytics_worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker-outbox:
    <<: *backend-service
    container_name: neura-worker-outbox
    command: ["python", "-m", "arq", "backend.app.workers.outbox_worker.WorkerSettings"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "backend.app.workers.outbox_worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker-publications:
    <<: *backend-service
    container_name: neura-worker-publications
    command: ["python", "-m", "backend.app.worker"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: neura-postgres
    env_file: *infra-env-files
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuaraai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neuaraai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neura-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redispass}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T00-00-00Z
    container_name: neura-minio
    env_file: *infra-env-files
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  create-bucket:
    image: minio/mc:RELEASE.2024-12-18T00-00-00Z
    container_name: neura-create-bucket
    env_file: *infra-env-files
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123}; do sleep 1; done &&
      mc mb --ignore-existing local/${S3_BUCKET:-neuaraai-media} &&
      mc anonymous set private local/${S3_BUCKET:-neuaraai-media}
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  sqlite_data:
  certbot_www:
  letsencrypt_data:
