x-env-file: &env-file
  - .env

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: neura-prometheus
    profiles: ["monitoring", "production"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: neura-grafana
    profiles: ["monitoring", "production"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: neura-node-exporter
    profiles: ["monitoring", "production"]
    command:
      - "--path.rootfs=/host"
      - "--path.procfss=/host/proc"
      - "--path.sysfss=/host/sys"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: neura-postgres-exporter
    profiles: ["monitoring", "production"]
    environment:
      DATA_SOURCE_NAME: "postgresql://neura:${POSTGRES_PASSWORD}@postgres:5432/neuaraai?sslmode=disable"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: neura-redis-exporter
    profiles: ["monitoring", "production"]
    environment:
      REDIS_ADDR: "redis:6379"
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: neura-nginx-exporter
    profiles: ["monitoring", "production"]
    command:
      - "--nginx.scrape-uri=http://nginx:80/nginx-health"
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: neura-uptime
    profiles: ["monitoring"]
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3002:3001"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
